# Made with ♥︎  by Eloquencer and Divakar

format = """\
[╭─](fg:directory)$directory\
$git_branch$git_status$docker_context\
$fill\
$status$cmd_duration$jobs\
$shell\
$env_var\
$line_break\
[╰╴](fg:directory)\
[$character]($style)\
"""

# Color Palette
palette = "Power10"

[palettes.Power10]
# colors
directory = 'cyan'
directorybold = 'bright-cyan' # WezTerm brightens ANSI 0-7 under bold; Ghostty does not
ubuntu = '#E95420'
greydimmed = '#424242'
user = 'bright-green'
userroot = 'bright-red'
sshsymbol = 'bright-green'
hostname = 'bright-green'
# git start ---
orangegit = '#E04D27'
conflicted = 'red'
ahead = 'yellow'
behind = 'yellow'
diverged = 'yellow'
uptodate = 'green'
untracked = 'red'
stashed = '#A52A2A' # redbrown
modified = '#C8AC00' # darker yellow
staged = 'green'
renamed = 'yellow'
deleted = 'orange'
# git end ---
jobs = 'bright-blue'
duration = 'yellow'
fill = '#424242' # greydimmed
status = 'red'

[directory]
format = "[ \uf07c ]($style)[$read_only]($read_only_style)[$repo_root]($repo_root_style)[$path]($style)"
style = 'fg:directorybold bold'
home_symbol = "~"
read_only = "\uf023 "
read_only_style = 'red'
truncation_length = 3
truncation_symbol = '…/'

[git_branch]
format = "[ \ue0b1 $symbol$branch(:$remote_branch)]($style)"
style = 'fg:orangegit'
symbol = "\ue0a0"

[git_status]
style = "fg:orangegit"
format = '([\[$all_status$ahead_behind\]]($style))'
stashed = "[$](fg:stashed) "

[fill]
style = 'fg:fill'
symbol = "\u2500" # no line: ' '

[status]
format = "[$symbol $hex_status( \uf0a2 $signal_number-$signal_name)]($style)"
style = 'fg:status'
symbol = " \uf00d"
disabled = false # the status module ships disabled, so this line is required

[cmd_duration]
format = "[‹\uf017 $duration]($style)"
style = 'fg:duration'
min_time = 500

[jobs]
format = "[‹](fg:jobs bold)[$symbol $number]($style)"
style = 'fg:jobs'
symbol = "\ueb7b"
symbol_threshold = 1
number_threshold = 2

# Customization and activation of some modules:
# Listed in the order of their position in the module rows above
[os]
format = "$symbol"
disabled = false # the os module ships disabled, so this line is required

[os.symbols]
Windows = "\uf17a " # nf-fa-windows (Win10/11)
Macos = "\uf302 "   # nf-fa-apple
Ubuntu = "[‹](fg:ubuntu)[\uebc9](fg:ubuntu) "
Linux = "\uf17c "   # nf-fa-linux — also what WSL reports, there is no separate WSL key

# Rendered from a variable computed once per shell (see .zshrc) instead of from
# the os module: os_info shells out to lsb_release, ~16ms on every repaint.
[env_var.STARSHIP_OS_ICON]
variable = 'STARSHIP_OS_ICON'
format = '$env_value'

[username]
format = "[\ueab6 ](fg:user bold)[$user]($style)[ ]()"
style_user = 'fg:user bold'
style_root = 'fg:userroot bold'
show_always = false

[hostname]
format = '[$ssh_symbol ](fg:sshsymbol bold)[$hostname](fg:hostname bold)[ ]()'
ssh_only = true
ssh_symbol = "\ue36e"

[direnv]
symbol = 'direnv'
style = 'fg:greydimmed'
format = "[\u3009$symbol $loaded/$allowed ]($style)"
allowed_msg = 'a'
not_allowed_msg = '!a'
denied_msg = 'x'
loaded_msg = '+'
unloaded_msg = '-'
disabled = false # the direnv module ships disabled, so this line is required
