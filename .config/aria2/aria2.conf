# aria2 daemon (RPC) config — managed with aria2p
# All paths are ABSOLUTE: --daemon chdirs, so relative paths silently break.
# Stowed to ~/.config/aria2/aria2.conf from ~/.dotfiles/.config/aria2/.
# State (session.txt) lives OUTSIDE the dotfiles repo: ~/.local/state/aria2/.

enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800

# store
dir=/home/eloquencer/Downloads
continue=true

# session persistence (auto-save every 60s; survives clean shutdown)
input-file=/home/eloquencer/.local/state/aria2/session.txt
save-session=/home/eloquencer/.local/state/aria2/session.txt
save-session-interval=60

# tuning
max-concurrent-downloads=5
max-connection-per-server=16
min-split-size=1M
split=5
retry-wait=3
max-tries=5

# completion
seed-ratio=1.0