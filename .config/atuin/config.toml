# Atuin config — local shell history, no sync

update_check = false

# Search
search_mode = "fuzzy"
filter_mode = "global"
search_mode_shell_up_key_binding = "prefix"
workspaces = true
command_chaining = true
enter_accept = true

# UI
show_preview = false
show_help = false
prefers_reduced_motion = true
# Ctrl as alternative to Alt for number shortcuts — uncomment if needed
# ctrl_n_shortcuts = true

# Key bindings
keymap_mode = "vim-insert"
keymap_cursor = { vim_insert = "steady-bar", vim_normal = "steady-block" }

# Block secrets from being saved to history
secrets_filter = true

# Reference: filter commands from history by pattern (unanchored regex)
# history_filter = [
#   "^secret-cmd",
#   "^innocuous-cmd .*--secret=.+",
# ]

# Reference: filter commands by working directory (unanchored regex)
# cwd_filter = [
#   "^/very/secret/directory",
# ]

# Make Ctrl+C respect exit_mode (behave like Esc) instead of always returning original
[keymap.emacs]
"ctrl-c" = "exit"

