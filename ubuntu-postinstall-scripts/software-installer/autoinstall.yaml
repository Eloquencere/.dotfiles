#cloud-config
autoinstall:
  version: 1

  timezone: America/New_York

  identity:
    realname: eloquencer
    hostname: dev-machine
    username: eloquencer
    password: "$6$jtk1hrh5hTIcH0i1$gdnmUl5bR.bWR8Bh0KLjW4nKCDuZvtOIUeKLoixS9dcTMEyRQxBW59eW6e2pT/2nwdx.jgWLdVVYHjtb4exep/"

  network:
    version: 2
    renderer: NetworkManager
    ethernets:
      wired:
        match:
          name: "en*"
        dhcp4: true
        nameservers:
          addresses:
            - 1.1.1.2              # Cloudflare
            - 2606:4700:4700::1112 # "
            - 1.0.0.2              # "
            - 2606:4700:4700::1002 # "
            - 9.9.9.9              # Quad9
            - 2620:fe::fe          # "
    # wifis:
    #   wifi:
    #     match:
    #       name: "wl*"
    #     dhcp4: true
    #     nameservers:
    #       addresses:
    #         - 1.1.1.2              # Cloudflare
    #         - 2606:4700:4700::1112 # "
    #         - 1.0.0.2              # "
    #         - 2606:4700:4700::1002 # "
    #         - 9.9.9.9              # Quad9
    #         - 2620:fe::fe          # "

  storage:
    config:
      - id: disk0
        type: disk
        match:
          size: largest
        ptable: gpt
        wipe: superblock-recursive

      # EFI System Partition (ESP) - required for UEFI boot
      - id: efi-partition
        type: partition
        device: disk0
        size: 512M
        flag: esp

      # ESP format (FAT32)
      - id: efi-format
        type: format
        fstype: vfat
        volume: efi-partition

      # Mount ESP at /boot/efi
      - id: efi-mount
        type: mount
        path: /boot/efi
        device: efi-format

      # Swap partition (8GB — recommended minimum for laptops)
      - id: swap-partition
        type: partition
        device: disk0
        size: 8G
        flag: swap

      # Swap format
      - id: swap-format
        type: format
        fstype: swap
        volume: swap-partition

      # Root partition (rest of disk)
      - id: root-partition
        type: partition
        device: disk0
        size: -1

      # Format as ext4
      - id: root-format
        type: format
        fstype: ext4
        volume: root-partition

      # Mount root
      - id: root-mount
        type: mount
        path: /
        device: root-format
        options: "noatime,errors=remount-ro"

  locale: en_US.UTF-8
  keyboard:
    layout: us

  source:
    id: ubuntu-desktop # Extended install
  drivers: # 3rd party Graphics & Wifi software
    install: true
  updates: all

  packages:
    - build-essential
    - pkg-config
    - wl-clipboard
    - libnss3-tools # certificate validation tools
    - libfuse2t64 # To run appimages
    - openjdk-25-jre # To run .jar files
    - libreoffice-java-common
    - zsh
    - nala
    - curl
    - stow
    - dos2unix
    - trash-cli
    - git
    # Flatpak package manager
    - flatpak

  shutdown: reboot

  late-commands:
    - curtin in-target --target=/target -- bash -c "dpkg --add-architecture i386; apt-get update"

    - curtin in-target --target=/target -- flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

    - curtin in-target --target=/target -- usermod -s /usr/bin/zsh eloquencer

