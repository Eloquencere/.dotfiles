#cloud-config
autoinstall:
  version: 1

  identity:
    hostname: dev-machine
    realname: eloquencer
    username: eloquencer
    password: "$6$jtk1hrh5hTIcH0i1$gdnmUl5bR.bWR8Bh0KLjW4nKCDuZvtOIUeKLoixS9dcTMEyRQxBW59eW6e2pT/2nwdx.jgWLdVVYHjtb4exep/"

  timezone: America/New_York
  locale: en_US.UTF-8
  keyboard:
    layout: us

  network:
    version: 2
    renderer: NetworkManager
    ethernets:
      wired:
        match:
          name: "en*"
        dhcp4: true
        nameservers:
          addresses:
            - 1.1.1.2              # Cloudflare
            - 2606:4700:4700::1112 # "
            - 1.0.0.2              # "
            - 2606:4700:4700::1002 # "
            - 9.9.9.9              # Quad9
            - 2620:fe::fe          # "

  storage:
    config:
      - id: disk0
        type: disk
        match:
          size: largest
        ptable: gpt
        wipe: zero
        grub_device: true

      # EFI System Partition (must be first partition)
      - id: esp
        type: partition
        device: disk0
        size: 512M
        flag: boot
        grub_device: true

      - id: esp-format
        type: format
        fstype: fat32
        volume: esp

      - id: esp-mount
        type: mount
        path: /boot/efi
        device: esp-format

      # Swap
      - id: swap-partition
        type: partition
        device: disk0
        size: 8G
        flag: swap

      - id: swap-format
        type: format
        fstype: swap
        volume: swap-partition

      # Root
      - id: root-partition
        type: partition
        device: disk0
        size: -1

      - id: root-format
        type: format
        fstype: ext4
        volume: root-partition

      - id: root-mount
        type: mount
        path: /
        device: root-format
        options: "noatime,errors=remount-ro"

  source:
    id: ubuntu-desktop # Extended install
  drivers: # 3rd party Graphics & Wifi software
    install: true

  packages:
    - build-essential
    - pkg-config
    - wl-clipboard
    - libnss3-tools # certificate validation tools
    - libfuse2t64 # To run appimages
    - openjdk-25-jre # To run .jar files
    - libreoffice-java-common
    - sshpass
    - zsh
    - curl
    - stow
    - dos2unix
    - trash-cli
    - git
    # Pkg managers
    - nala
    - flatpak
  updates: all

  late-commands:
    - curtin in-target -- bash -c "dpkg --add-architecture i386; apt-get update"

    - curtin in-target -- flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

    - curtin in-target -- usermod -s /usr/bin/zsh eloquencer

  shutdown: poweroff # WARN: change to 'poweroff' the real thing & 'reboot' for testing

